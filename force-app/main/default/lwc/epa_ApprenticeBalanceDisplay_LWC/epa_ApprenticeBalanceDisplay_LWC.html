<template>
    <lightning-card title="My Leave Balance" icon-name="standard:calibration">
        <template if:true={hasBalance}>
            <div class="slds-p-around_medium">
                <lightning-layout multiple-rows>
                    <lightning-layout-item size="4" padding="around-small">
                        <div class="slds-box slds-box_x-small slds-text-align_center">
                            <p class="slds-text-title_caps slds-m-bottom_xx-small">Annual Entitlement</p>
                            <p class="slds-text-heading_large">{annualEntitlement}</p>
                            <p class="slds-text-body_small">days</p>
                        </div>
                    </lightning-layout-item>
                    <lightning-layout-item size="4" padding="around-small">
                        <div class="slds-box slds-box_x-small slds-text-align_center">
                            <p class="slds-text-title_caps slds-m-bottom_xx-small">Days Used</p>
                            <p class="slds-text-heading_large">{daysUsed}</p>
                            <p class="slds-text-body_small">days</p>
                        </div>
                    </lightning-layout-item>
                    <lightning-layout-item size="4" padding="around-small">
                        <div class="slds-box slds-box_x-small slds-text-align_center">
                            <p class="slds-text-title_caps slds-m-bottom_xx-small">Days Remaining</p>
                            <p class="slds-text-heading_large">{daysRemaining}</p>
                            <p class="slds-text-body_small">days</p>
                        </div>
                    </lightning-layout-item>
                    <lightning-layout-item size="12" padding="around-small">
                        <lightning-progress-bar
                            value={progressPercent}
                            variant={progressVariant}
                            size="medium"
                        ></lightning-progress-bar>
                        <p class="slds-text-body_small slds-text-align_center slds-m-top_xx-small">
                            {progressPercent}% of entitlement used
                        </p>
                    </lightning-layout-item>
                </lightning-layout>
            </div>
        </template>
        <template if:true={hasNoRecord}>
            <div class="slds-illustration slds-illustration_small slds-p-around_medium">
                <div class="slds-text-longform">
                    <h3 class="slds-text-heading_medium">No Balance Found</h3>
                    <p class="slds-text-body_regular slds-text-color_weak">
                        No leave balance found for the current year. Please contact your administrator.
                    </p>
                </div>
            </div>
        </template>
        <template if:true={hasError}>
            <div class="slds-p-around_medium slds-text-color_error">
                <p>An error occurred while loading your leave balance. Please try again later.</p>
            </div>
        </template>
    </lightning-card>
</template>
