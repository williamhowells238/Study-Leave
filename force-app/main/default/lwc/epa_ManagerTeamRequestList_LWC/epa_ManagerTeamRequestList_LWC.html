<template>
    <lightning-card title="Team Study Leave Requests" icon-name="standard:people">
        <div class="slds-p-horizontal_medium slds-p-bottom_small">
            <lightning-combobox
                name="statusFilter"
                label="Filter by Status"
                value={selectedStatus}
                options={statusOptions}
                onchange={handleStatusChange}
            ></lightning-combobox>
        </div>
        <template if:true={hasRequests}>
            <lightning-datatable
                key-field="Id"
                data={requests}
                columns={columns}
                onrowaction={handleRowAction}
                hide-checkbox-column
            ></lightning-datatable>
        </template>
        <template if:false={hasRequests}>
            <template if:false={error}>
                <div class="slds-illustration slds-illustration_small slds-p-around_medium">
                    <div class="slds-text-longform">
                        <h3 class="slds-text-heading_medium">No Team Requests Found</h3>
                        <p class="slds-text-body_regular slds-text-color_weak">
                            There are no study leave requests from your direct reports to display.
                        </p>
                    </div>
                </div>
            </template>
        </template>
        <template if:true={error}>
            <div class="slds-p-around_medium slds-text-color_error">
                <p>An error occurred while loading team requests. Please try again later.</p>
            </div>
        </template>
    </lightning-card>
</template>
