<template>
    <lightning-card title="Team Study Leave Requests" icon-name="standard:people">
        <div class="slds-p-horizontal_medium slds-p-bottom_small">
            <lightning-combobox
                name="statusFilter"
                label="Filter by Status"
                value={selectedStatus}
                options={statusOptions}
                onchange={handleStatusChange}
            ></lightning-combobox>
        </div>
        <template if:true={hasRequests}>
            <lightning-datatable
                key-field="Id"
                data={requests}
                columns={columns}
                onrowaction={handleRowAction}
                hide-checkbox-column
            ></lightning-datatable>
        </template>
        <template if:false={hasRequests}>
            <template if:false={error}>
                <div class="slds-illustration slds-illustration_small slds-p-around_medium">
                    <div class="slds-text-longform">
                        <h3 class="slds-text-heading_medium">No Team Requests Found</h3>
                        <p class="slds-text-body_regular slds-text-color_weak">
                            There are no study leave requests from your direct reports to display.
                        </p>
                    </div>
                </div>
            </template>
        </template>
        <template if:true={error}>
            <div class="slds-p-around_medium slds-text-color_error">
                <p>An error occurred while loading team requests. Please try again later.</p>
            </div>
        </template>
    </lightning-card>

    <!-- Rejection Reason Modal -->
    <template if:true={showRejectModal}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="reject-modal-heading" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" aria-label="Close" onclick={handleRejectCancel}>
                    <lightning-icon icon-name="utility:close" alternative-text="Close" size="small" variant="inverse"></lightning-icon>
                </button>
                <div class="slds-modal__header">
                    <h1 id="reject-modal-heading" class="slds-modal__title slds-hyphenate">Reject Study Leave Request</h1>
                </div>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-textarea
                        label="Rejection Reason (Optional)"
                        value={rejectionReason}
                        onchange={handleRejectReasonChange}
                        placeholder="Enter a reason for rejecting this request..."
                        max-length="1000"
                    ></lightning-textarea>
                </div>
                <div class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={handleRejectCancel}></lightning-button>
                    <lightning-button label="Confirm Rejection" variant="destructive" onclick={handleRejectConfirm} class="slds-m-left_x-small"></lightning-button>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>
</template>
