<template>
    <lightning-card title="My Study Leave Requests" icon-name="standard:event">
        <template if:true={hasRequests}>
            <lightning-datatable
                key-field="Id"
                data={requests}
                columns={columns}
                onrowaction={handleRowAction}
                hide-checkbox-column
            ></lightning-datatable>
        </template>
        <template if:false={hasRequests}>
            <template if:false={error}>
                <div class="slds-illustration slds-illustration_small slds-p-around_medium">
                    <div class="slds-text-longform">
                        <h3 class="slds-text-heading_medium">No Requests Found</h3>
                        <p class="slds-text-body_regular slds-text-color_weak">
                            You have not submitted any study leave requests yet.
                        </p>
                    </div>
                </div>
            </template>
        </template>
        <template if:true={error}>
            <div class="slds-p-around_medium slds-text-color_error">
                <p>An error occurred while loading your requests. Please try again later.</p>
            </div>
        </template>
    </lightning-card>
</template>
