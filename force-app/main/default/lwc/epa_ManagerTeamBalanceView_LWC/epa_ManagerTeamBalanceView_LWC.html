<template>
    <lightning-card title="Team Leave Balances" icon-name="standard:calibration">
        <template if:true={hasBalances}>
            <lightning-datatable
                key-field="Id"
                data={balances}
                columns={columns}
                hide-checkbox-column
            ></lightning-datatable>
        </template>
        <template if:false={hasBalances}>
            <template if:false={error}>
                <div class="slds-illustration slds-illustration_small slds-p-around_medium">
                    <div class="slds-text-longform">
                        <h3 class="slds-text-heading_medium">No Team Balances Found</h3>
                        <p class="slds-text-body_regular slds-text-color_weak">
                            There are no leave balance records for your direct reports to display.
                        </p>
                    </div>
                </div>
            </template>
        </template>
        <template if:true={error}>
            <div class="slds-p-around_medium slds-text-color_error">
                <p>An error occurred while loading team balances. Please try again later.</p>
            </div>
        </template>
    </lightning-card>
</template>
